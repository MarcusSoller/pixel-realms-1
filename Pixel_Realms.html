const BCH=[
['Welcome & Controls',()=>'<p>Pixel Realms is a survival RPG: gather, craft, fight, tame monsters and explore ten hidden realms.</p><ol><li><b>Move:</b> touch anywhere on the left half of the screen and drag. Keyboard: WASD or arrows.</li><li><b>ATTACK (bottom right):</b> tap to attack or mine what you face. Drag the button to aim in any direction. Keyboard: Space.</li><li><b>USE:</b> talk, open, plant, place blocks and use the item in your selected hotbar slot. Keyboard: F.</li><li><b>RIDE:</b> mount or dismount. Keyboard: R.</li><li><b>Top tabs:</b> bag, crafting, pets, this book and more. Keyboard: E.</li><li><b>MAP:</b> tap the minimap (or press M) to open the full map. Drag to pan, pinch or scroll to zoom. Unexplored land stays black, and caves, portals, beanstalks, runes and buildings you find are marked.</li><li><b>Hotbar:</b> tap a slot to select it. Fill the slots from the BAG tab.</li></ol><p>The game saves by itself every 20 seconds and when you pause. Reinstalling the app erases saves.</p>'],
['Survive & Level Up',()=>'<p>Keep an eye on your HP and food bars. Eat to refill food. HP regenerates slowly, and only when you are out of combat. Potions and food heal faster.</p><p>Defeat monsters to earn XP. Stronger enemies give bonus XP (up to 7 times). A huge win can raise several levels at once.</p><p>Every level gives 1 stat point. Spend them in the STATS tab on Agility, Strength, Intelligence, Wisdom, Health and Regeneration. Your species also gives a bonus.</p>'],
['Gathering & Crafting',()=>'<ol><li>Hold ATTACK on a tree to get logs, then craft planks in the CRAFT tab.</li><li>Craft and place a Workbench. Near it you can craft pickaxes, torches, beds and more.</li><li>Better pickaxes break tougher ore: stone, iron, diamond and crystal.</li><li>A Furnace smelts ingots. An Alchemy Table brews potions. A Gear Table crafts gear from exact materials.</li><li>Tap ? next to any recipe to read about that item.</li></ol><p>Each realm has its own ores and plants. Look in the Items tab to see where an item comes from.</p>'],
['Combat & Elements',()=>'<p>Pick from 15 weapon types and 10 shields. Drag the ATTACK button to aim. You can attack even with no enemy close by.</p><p>Elements beat each other:</p>'+elChart()+'<p>Elemental hits can cause burn, slow, freeze, stun, shock, blind or poison. A ward tonic makes you immune for 2 minutes.</p>'],
['Gear & Forging',()=>'<p>You have 9 gear slots: weapon, off-hand, helmet, armor, gloves, pants, boots, ring and cape. Open the GEAR tab to equip.</p><p>Forge new gear at a workbench, furnace or blacksmith. It costs planks, iron, coins and monster materials. A blade can be given an element. Blacksmiths also enhance gear from +1 to +9.</p><p>Wearing a full set gives a bonus and a glowing aura. Shiny gear has special effects. Sell spare gear to a Merchant.</p>'],
['Pets & Eggs',()=>'<p>Weaken a wild monster, then throw a Capture orb at it (select the orb, press ATTACK and drag to aim like a bow). A miss loses the orb. The chance depends on its HP and rarity, and Lure I, II and III potions add +10%, +30% and +50% for 20 seconds. Eggs hatch after about 900 steps in an incubator (up to 3).</p><p>Pets are Tank, Attacker or Support. Tanks draw enemy attacks, Supports heal you every 7 seconds. A knocked-out pet recovers after 35 seconds.</p><p>Pets level up from kills and evolve at the level shown in the Dex (about Lv 15 to 45). Each element has a passive: '+PAB.map((p,i)=>ELN[i]+' '+p).join('; ')+'.</p><p>Pets of '+RKN[4]+' rank or better can be ridden, and they fight while you ride. The Daycare Pen trains pets.</p>'],
['Mounts, Boats & Fishing',()=>'<p>Fifty mounts exist: land, water and air. Buy or win them, equip one in the MOUNT tab and press RIDE. Air mounts are very expensive.</p><p>Without a water mount, deep water slows you by 75%. Boats launch from the MOUNT tab.</p><p>Fishing: select a rod, face water, press USE to cast and USE again when the float dips. Better rods bite faster and find rarer fish.</p>'],
['Farming, Cooking & Potions',()=>'<ol><li>Till grass with a Hoe, then plant wheat, carrot or pumpkin seeds.</li><li>Rain doubles growth. Hold ATTACK on the ripe crop to harvest it.</li><li>Cook at a bench or furnace. Food restores hunger and some HP.</li><li>Brew potions at an Alchemy Table: healing, speed, power, ward tonics, weapon oils and pet treats.</li></ol>'],
['Villages, Quests & Gyms',()=>'<p>Villages have a Merchant, Blacksmith, Quest Hall, Inn, Gym, houses and sometimes an Arena. Walk onto stairs to reach upper floors and basements.</p><p>Quest Hall quests give coins and XP. Inns restore you and set your respawn point. Gym leaders give element badges when you beat them. The Dragon Aerie needs 3 badges.</p><p>Wandering adventurers will trade, or duel you together with their partner monster.</p>'],
['The Ten Realms',()=>'<ul><li><b>Hollow Deep</b> (caves): enter through cave mouths in mountains.</li><li><b>Sky Realm</b>: climb the giant beanstalk.</li><li><b>Sunken Depths</b>: dive from deep water on a water mount.</li><li><b>Fey Wood</b>: a fairy ring in forests, open only at night.</li><li><b>Ember Depths</b>: a lava vent in the desert. Needs a Fire ward tonic or demon species.</li><li><b>Frostbound Hold</b>: an ice gate in snowfields. Needs an Ice ward tonic, or giant or werewolf species.</li><li><b>Dragon Aerie</b>: a dragon shrine on mountains. Needs 3 gym badges.</li><li><b>Shadow, Crystal and Spirit realms</b>: ruin portals. Each opens with a Rune from a ruin chest.</li></ul><p>Each realm has its own monsters, ores, town, events and guardian bosses.</p>'],
['Weather, Dangers & Rare Finds',()=>'<p>Weather changes: rain boosts crops, storms are risky. Disasters strike now and then: earthquakes, meteor showers, wildfires and eclipses.</p><p>Watch out for monster, elite and bandit camps, and guardian lairs. Some monsters only appear at night, in rain or during an eclipse.</p><p>Rare things exist: shiny monsters (1 in 15,000), monsters that spawn already evolved, rare chests, rare eggs and unique boss drops.</p>'],

<script>
/* ===== MULTIPLAYER: internet play with room codes (WebRTC via PeerJS). Host = authority for world + monsters. ===== */
(()=>{
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',VER=1;
const MP=window.MPX={role:0,code:'',peers:new Map(),hostConn:null,peer:null,busy:0,status:''};
const RP=window.MPRP=new Map(),MIRR=new Map(),PARTS=new Map(),LOG=[];
let REAL=null,CUR=null,SEQ=0,APPLY=0,NOKILL=0,joinRes=null,lastEnv=0;
const PCFG={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const say=s=>{try{tip(s)}catch(e){}};
const myName=()=>(P.name||'Player').slice(0,14);
const rnd6=()=>Math.random().toString(36).slice(2,8);
const clean=s=>String(s==null?'':s).replace(/[<>&"]/g,'').slice(0,40);

/* ---------- transport ---------- */
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>window.Peer?res():rej(new Error('PeerJS failed to load'));s.onerror=()=>rej(new Error('No internet? Could not load the connection library'));document.head.appendChild(s)})}
function mkPeer(id){return new Promise((res,rej)=>{let done=0;const p=id?new Peer(id,PCFG):new Peer(PCFG),to=setTimeout(()=>{if(!done){done=1;try{p.destroy()}catch(e){}rej(new Error('Timed out reaching the matchmaking server'))}},15000);p.on('open',()=>{if(!done){done=1;clearTimeout(to);res(p)}});p.on('error',e=>{if(!done){done=1;clearTimeout(to);try{p.destroy()}catch(_){}rej(e)}else if(e&&e.type!='peer-unavailable')status('Connection problem: '+(e.type||e.message))})})}
function rawSend(c,o){try{if(c&&c.open!==false)c.send(o)}catch(e){}}
function sendC(c,o){const s=JSON.stringify(o);if(s.length<14000){rawSend(c,o);return}const id=rnd6()+rnd6(),n=Math.ceil(s.length/12000);for(let i=0;i<n;i++)rawSend(c,{t:'~',id,i,n,d:s.slice(i*12000,(i+1)*12000)})}
function reasm(m){let a=PARTS.get(m.id);if(!a){a={n:m.n,p:[],c:0};PARTS.set(m.id,a)}if(!a.p[m.i]){a.p[m.i]=m.d;a.c++}if(a.c<a.n)return null;PARTS.delete(m.id);try{return JSON.parse(a.p.join(''))}catch(e){return null}}
function sendTo(id,o){if(MP.role==1){const p=MP.peers.get(id);if(p){o.from='H';sendC(p.conn,o)}}else if(MP.role==2){o.to=id;sendC(MP.hostConn,o)}}
function bcast(o,except){for(const[id,p]of MP.peers)if(id!==except)sendC(p.conn,o)}
function status(s){MP.status=s;if(window.MPUI)MPUI.render()}

/* ---------- players ---------- */
function mkRP(id,n,ch){return{id,name:clean(n)||'Player',ch,x:0,y:0,tx:0,ty:0,d:[0,1],fr:0,mv:0,hp:1,mh:1,pet:-1,ps:0,lv:1,has:0,po:{x:0,y:0,f:1},proxy:{x:0,y:0,d:[0,1],fr:0,mv:0}}}
function infoList(except){const a=[{id:'H',n:myName(),ch:P.ch}];for(const[id,r]of RP)if(id!==except)a.push({id,n:r.name,ch:r.ch});return a}
function myState(){const p=PETS&&PETS[AP]&&!PETS[AP].ko&&AP>=0?PETS[AP]:null;return{x:Math.round(pl.x*10)/10,y:Math.round(pl.y*10)/10,d:pl.d,mv:pl.mv?1:0,hp:Math.round(hp),mh:mhp(),pet:p?p.sp:-1,ps:p&&p.shiny?1:0,lv:LV}}
function setRP(r,s){r.tx=s.x;r.ty=s.y;if(!r.has){r.x=s.x;r.y=s.y;r.has=1}r.d=s.d||r.d;r.mv=s.mv;r.hp=s.hp;r.mh=s.mh||1;r.pet=s.pet;r.ps=s.ps;r.lv=s.lv}

/* ---------- host ---------- */
async function startHost(){
  if(MP.role||MP.busy)return;if(!playing||!WD||!pl){status('Open a world first, then host it.');return}
  MP.busy=1;status('Connecting to the matchmaking server...');
  try{await loadPeer();let p=null,code='';
    for(let t=0;t<6&&!p;t++){code='';for(let i=0;i<5;i++)code+=AL[Math.random()*AL.length|0];try{p=await mkPeer('prr-'+code)}catch(e){if(!e||e.type!='unavailable-id')throw e}}
    if(!p)throw new Error('Could not reserve a room code');
    MP.peer=p;MP.code=code;MP.role=1;MP.peers.clear();RP.clear();
    p.on('connection',c=>{c.on('data',d=>{let m=d;if(m&&m.t=='~'){m=reasm(m);if(!m)return}hostRx(c,m)});const gone=()=>dropGuest(c);c.on('close',gone);c.on('error',gone)});
    p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
    status('Room '+code+' is open. Share the code with friends!');say('Room code: '+code)
  }catch(e){status('Could not host: '+(e&&(e.message||e.type)||e))}
  MP.busy=0;if(window.MPUI)MPUI.render()}
function dropGuest(c){const id=c.pid;if(!id||!MP.peers.has(id))return;const r=RP.get(id);MP.peers.delete(id);RP.delete(id);bcast({t:'pl',id});sysChat((r?r.name:'A player')+' left');if(window.MPG)MPG.gone(id);if(window.MPUI)MPUI.render()}
function hostRx(c,m){
  if(m.t=='hello'){if(m.v!==VER){sendC(c,{t:'bye',r:'Version mismatch - update the game'});return}
    if(c.pid)return;const id='G'+(++SEQ);c.pid=id;const name=clean(m.n)||'Player';MP.peers.set(id,{conn:c,name});const r=mkRP(id,name,m.ch);RP.set(id,r);
    sendC(c,{t:'welcome',pid:id,seed:SEED,mods:MODS,flr:FLR,time,wx:WX,sp:{x:sp.x,y:sp.y},wid:WD.id,hn:myName(),px:REAL?REAL.x:pl.x,py:REAL?REAL.y:pl.y,pl:infoList(id)});
    bcast({t:'pj',id,n:name,ch:m.ch},id);sysChat(name+' joined');if(window.MPUI)MPUI.render();return}
  if(!c.pid)return;const id=c.pid,r=RP.get(id);if(!r)return;
  if(m.to&&m.to!=='H'){const f=Object.assign({},m,{from:id});delete f.to;sendTo(m.to,f);return}
  switch(m.t){
    case'pos':setRP(r,m);break;
    case'blk':applyBlk(m);bcast({t:'blk',x:m.x,y:m.y,v:m.v},id);break;
    case'flr':FLR[m.k]=m.i;bcast({t:'flr',k:m.k,i:m.i},id);break;
    case'chat':chatIn(id,r.name,m.m);bcast({t:'chat',id,n:r.name,m:clean2(m.m)},id);break;
    case'hit':hostHit(c,r,m);break;
    default:if(window.MPG&&/^(tr|du)/.test(m.t))MPG.rx(id,m)}}
const clean2=s=>String(s==null?'':s).replace(/[<>]/g,'').slice(0,120);

/* host: damage from guests */
function hostHit(c,r,m){const mob=mobs.find(o=>o.mid===m.id);if(!mob||mob.gym!=null)return;const d=Math.max(0,Math.min(100000,+m.d||0));if(!d)return;
  mob.hp-=d;mob.h=.2;mob.gt=9;if(!mob.ret)mob.aggro=1;mob.kx=+m.kx||0;mob.ky=+m.ky||0;
  if(m.bn)mob.bn=4;if(m.sl)mob.sl=3;if(m.ps)mob.ps=5;
  if(mob.hp<=0){const i=mobs.indexOf(mob);if(i>=0)mobs.splice(i,1);if(mob.ck){mob.ck.n--;if(mob.ck.n<=0){mob.ck.rs=Date.now()+90000;mob.ck.act=0}}if(boss===mob)boss=null;
    sendC(c,{t:'kill',mid:mob.mid,si:mob.s.i,lvl:mob.lvl,sc:mob.sc,boss:mob.boss?1:0,shiny:mob.shiny?1:0,x:mob.x,y:mob.y})}}

/* ---------- guest ---------- */
async function joinRoom(code){
  if(MP.role||MP.busy)return;code=String(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4){status('Enter the room code');return}
  MP.busy=1;status('Connecting...');
  try{await loadPeer();const p=await mkPeer(null);MP.peer=p;
    const c=p.connect('prr-'+code,{reliable:true,serialization:'json'});
    await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('Room not found or unreachable')),15000);c.on('open',()=>{clearTimeout(to);res()});c.on('error',e=>{clearTimeout(to);rej(e)});p.on('error',e=>{clearTimeout(to);rej(new Error(e&&e.type=='peer-unavailable'?'Room not found':(e&&e.message)||'Connection error'))})});
    MP.hostConn=c;c.on('data',d=>{let m=d;if(m&&m.t=='~'){m=reasm(m);if(!m)return}guestRx(m)});
    const bye=()=>{if(MP.role==2)disconnected('Disconnected from the host')};c.on('close',bye);c.on('error',bye);
    status('Joining...');const w=await new Promise((res,rej)=>{joinRes=res;const to=setTimeout(()=>rej(new Error('Host did not answer')),20000);joinRes=v=>{clearTimeout(to);res(v)};sendC(c,{t:'hello',v:VER,n:myName(),ch:P.ch})});
    await enterVisit(w,code)
  }catch(e){status('Could not join: '+(e&&(e.message||e.type)||e));leaveNet(true)}
  MP.busy=0;if(window.MPUI)MPUI.render()}
async function enterVisit(w,code){
  if(playing&&WD)save();
  const wid='mp'+w.wid;let rec=null;try{rec=LS('pr2_w_'+wid)}catch(e){}let isNew=0;
  if(!rec){isNew=1;rec={id:wid,name:clean(w.hn)+"'s world",seed:w.seed,mods:{},pl:{x:w.px,y:w.py,hp:40,food:10},inv:{},time:w.time,sp:{x:w.sp.x,y:w.sp.y},lv:1}}
  rec.seed=w.seed;rec.mods=w.mods||{};rec.flr=w.flr||{};rec.sp={x:w.sp.x,y:w.sp.y};rec.pl=Object.assign({},rec.pl,{x:w.px,y:w.py});rec.time=w.time;rec.name=clean(w.hn)+"'s world";
  if(!P.worlds.some(x=>x.id==wid))P.worlds.push({id:wid,name:rec.name});else P.worlds.forEach(x=>{if(x.id==wid)x.name=rec.name});
  SV('pr2_w_'+wid,rec);SV('pr2_prof',P);
  MP.role=2;MP.code=code;RP.clear();MIRR.clear();
  begin(rec);
  if(isNew){STATS=Object.assign({agi:0,str:0,int:0,wis:0,hlt:0,reg:0},P.stat);{const rb=RACES[P.ch.race||0][3];for(const k in rb)STATS[k]+=rb[k]}SPT=5-Object.values(P.stat||{}).reduce((a,b)=>a+b,0);hp=mhp();playing=false;menu('starter')}
  time=w.time;if(w.wx)WX=w.wx;
  for(const i of w.pl)if(i.id!==MP.me&&i.id!==w.pid){const r=mkRP(i.id,i.n,i.ch);RP.set(i.id,r)}
  MP.me=w.pid;status('Connected to '+rec.name+'.');say('Joined '+rec.name+'!');sysChat('You joined '+clean(w.hn)+"'s world");if(window.MPUI){MPUI.render();MPUI.close()}}
function guestRx(m){
  switch(m.t){
    case'welcome':if(joinRes){const f=joinRes;joinRes=null;f(m)}break;
    case'bye':disconnected(m.r||'Host closed the room');break;
    case'pj':if(m.id!==MP.me){RP.set(m.id,mkRP(m.id,m.n,m.ch));sysChat(clean(m.n)+' joined')}break;
    case'pl':{const r=RP.get(m.id);if(r)sysChat(r.name+' left');RP.delete(m.id);if(window.MPG)MPG.gone(m.id);break}
    case'st':guestState(m);break;
    case'blk':applyBlk(m);break;
    case'flr':FLR[m.k]=m.i;break;
    case'env':time=m.time;if(m.wx)WX=m.wx;break;
    case'hurt':hurtP(m.n,m.po,m.src||'a monster',m.el);break;
    case'kill':guestKill(m);break;
    case'chat':chatIn(m.id,clean(m.n),m.m);break;
    default:if(window.MPG&&/^(tr|du)/.test(m.t))MPG.rx(m.from,m)}}
function guestState(m){
  for(const a of m.p){const r=RP.get(a[0]);if(!r)continue;setRP(r,{x:a[1],y:a[2],d:[a[3],a[4]],mv:a[5],hp:a[6],mh:a[7],pet:a[8],ps:a[9],lv:a[10]})}
  const seen=new Set();
  for(const a of m.m){const mid=a[0];seen.add(mid);let o=MIRR.get(mid);
    if(!o){const s=SP[a[1]];if(!s||s.void)continue;o=mkMob(s,a[2],a[3],{mid,net:1});mobs.push(o);MIRR.set(mid,o);o.tx=a[2];o.ty=a[3]}
    o.tx=a[2];o.ty=a[3];o.hp=a[4];o.mhp=a[5];o.f=a[6];o.lvl=a[7];o.sc=a[8]/100;o.boss=a[9]?1:0;o.shiny=a[10]?1:0;if(a[11])o.h=Math.max(o.h,.12);o.aggro=a[12]}
  for(const[mid,o]of MIRR)if(!seen.has(mid)){MIRR.delete(mid);const i=mobs.indexOf(o);if(i>=0)mobs.splice(i,1)}}
function guestKill(m){let o=MIRR.get(m.mid);MIRR.delete(m.mid);if(!o){const s=SP[m.si];if(!s)return;o=mkMob(s,m.x,m.y,{lvl:m.lvl,sc:m.sc,boss:m.boss,shiny:m.shiny})}
  o.hp=0;NOKILL=0;_km(o)}
function disconnected(msg){if(!MP.role)return;leaveNet(true);status(msg);say(msg)}
function leaveNet(quiet){const was=MP.role;try{if(MP.role==1)bcast({t:'bye',r:'The host closed the room'})}catch(e){}
  try{if(MP.hostConn)MP.hostConn.close()}catch(e){}try{for(const[,p]of MP.peers)p.conn.close()}catch(e){}try{if(MP.peer)MP.peer.destroy()}catch(e){}
  MP.role=0;MP.peer=null;MP.hostConn=null;MP.peers.clear();MP.code='';MP.me='';RP.clear();joinRes=null;
  if(was==2){for(const o of MIRR.values()){const i=mobs.indexOf(o);if(i>=0)mobs.splice(i,1)}MIRR.clear()}
  if(window.MPG)MPG.reset();if(!quiet)status('');if(window.MPUI)MPUI.render()}

/* ---------- blocks / chat ---------- */
function applyBlk(m){APPLY=1;try{const x=m.x|0,y=m.y|0,v=m.v|0;if(REALM=='w')_so(x,y,v);else{const cx=x>>4,cy=y>>4,k=cx+','+cy;(MODS[k]=MODS[k]||{})[ti(x,y)]=v}}catch(e){}APPLY=0}
function netBlk(x,y,v){const o={t:'blk',x,y,v};if(MP.role==1)bcast(o);else if(MP.role==2)sendC(MP.hostConn,o)}
function chatIn(id,name,text){text=clean2(text);LOG.push({n:name,m:text,t:Date.now()});if(LOG.length>60)LOG.shift();const r=RP.get(id);if(r&&r.has)ft(r.x,r.y-34,text.slice(0,28),'#ffffff');if(window.MPUI)MPUI.chat()}
function sysChat(text){LOG.push({n:'',m:text,t:Date.now()});if(LOG.length>60)LOG.shift();if(window.MPUI)MPUI.chat()}
function sendChat(text){text=clean2(text).trim();if(!text||!MP.role)return;if(MP.role==1){bcast({t:'chat',id:'H',n:myName(),m:text});chatIn('H',myName(),text);ft(pl.x,pl.y-34,text.slice(0,28),'#ffffff')}else{sendC(MP.hostConn,{t:'chat',m:text});chatIn(MP.me,myName(),text);ft(pl.x,pl.y-34,text.slice(0,28),'#ffffff')}}

/* ---------- hooks into the game ---------- */
const _so=setObj;setObj=function(x,y,v){_so(x,y,v);if(!APPLY&&MP.role&&REALM=='w')netBlk(x,y,v)};
window.MPFLR=(k,i)=>{if(!APPLY&&MP.role){const o={t:'flr',k,i};if(MP.role==1)bcast(o);else sendC(MP.hostConn,o)}};
const _hp=hurtP;hurtP=function(n,po,src,el){if(MP.role==1&&CUR&&!PETGT){sendTo(CUR.id,{t:'hurt',n,po:po?1:0,src:src||'',el});return}return _hp.apply(this,arguments)};
const _dm=dmgMob;dmgMob=function(m,n,kb,el,fx){
  if(MP.role==2&&m&&m.net){const h0=m.hp;NOKILL=1;try{_dm(m,n,kb,el,fx)}finally{NOKILL=0}const dd=Math.max(0,h0-m.hp);if(m.hp<=0)m.hp=1;
    sendC(MP.hostConn,{t:'hit',id:m.mid,d:dd,kx:Math.round(m.kx),ky:Math.round(m.ky),bn:fx==0?1:0,sl:fx==5?1:0,ps:fx==7?1:0});return}
  return _dm.apply(this,arguments)};
const _km=killMob;killMob=function(m){if(NOKILL)return;return _km(m)};
const _sm=spawnMob;spawnMob=function(){if(MP.role==2)return;if(MP.role==1&&RP.size&&REAL){const all=[REAL,...[...RP.values()].filter(r=>r.has).map(r=>r.proxy)],t=all[Math.random()*all.length|0];if(t!==REAL){const sv=pl;pl=t;try{_sm()}finally{pl=sv}return}}return _sm()};
window.MPSKIP=m=>MP.role==2;window.MPCUR_=()=>!!CUR;
window.MPSWAP=m=>{if(MP.role!==1||!RP.size||!REAL||m.gym!=null||m.s.special||m.adv){CUR=null;if(REAL)pl=REAL;return}
  let best=REAL,bd=Math.hypot(m.x-REAL.x,m.y-REAL.y);CUR=null;
  for(const r of RP.values()){if(!r.has)continue;const d=Math.hypot(m.x-r.x,m.y-r.y);if(d<bd){bd=d;best=r.proxy;CUR=r}}pl=best};
window.MPRESTORE=()=>{CUR=null;if(REAL)pl=REAL};
const _up=update;update=function(dt){REAL=pl;CUR=null;try{_up(dt)}finally{if(REAL)pl=REAL;CUR=null}
  if(MP.role==1)for(let i=prj.length-1;i>=0;i--){const p=prj[i];for(const r of RP.values()){if(!r.has)continue;if(Math.hypot(p.x-r.x,p.y-r.y+6)<7){sendTo(r.id,{t:'hurt',n:p.dm,po:0,src:'a projectile',el:p.el});p.l=0;break}}}
  if(MP.role==2){if(mobs.some(m=>!m.net))mobs=mobs.filter(m=>m.net);if(boss&&!boss.net)boss=null;for(const o of MIRR.values()){const k=Math.min(1,dt*12);o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k}}
  for(const r of RP.values()){const k=Math.min(1,dt*14);r.x+=(r.tx-r.x)*k;r.y+=(r.ty-r.y)*k;r.proxy.x=r.x;r.proxy.y=r.y;r.proxy.d=r.d}};
const _pause=pause;pause=function(){if(!MP.role)return _pause();if(!playing)return;save();if(panelOpen)togP();menu('pause')};
if(ACT){const _q=ACT.quit;ACT.quit=()=>{leaveNet(true);_q()};ACT.mp=()=>{if(window.MPUI)MPUI.open()}}

/* ---------- drawing remote players ---------- */
window.MPENTS=(cx,cy)=>{const out=[];if(!MP.role)return out;const w=V.w,h=V.h;
  for(const r of RP.values()){if(!r.has||!r.ch)continue;if(Math.abs(r.x-cx-w/2)>w/2+40||Math.abs(r.y-cy-h/2)>h/2+40)continue;
    out.push({y:r.y,f:()=>{const x=Math.round(r.x-cx),y=Math.round(r.y-cy),f=r.d&&r.d[0]?r.d[0]:(r.po.f||1);r.po.f=f;
      if(r.pet>=0&&SP[r.pet]){r.po.x=r.x-10*f;r.po.y=r.y+1;dmon(x-10*f,y+1,SP[r.pet],tm,0,1,undefined,f,r.ps,faceDir(r.po,0),r.po.mov>0)}
      try{chdraw(g,x,y,r.d||[0,1],r.mv?Math.floor(tm*8)%2:0,r.ch,r.mv?1:0)}catch(e){}
      g.font='bold 9px Pixelify Sans,monospace';const nm=r.name+' Lv'+r.lv,tw=g.measureText(nm).width;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x-tw/2-2,y-35,tw+4,10);g.fillStyle='#9fe0ff';g.fillText(nm,x-tw/2,y-27);
      const bw=22,pc=Math.max(0,Math.min(1,r.hp/(r.mh||1)));g.fillStyle='#000';g.fillRect(x-bw/2-1,y-24,bw+2,4);g.fillStyle=pc>.5?'#4fd06a':pc>.25?'#e0c040':'#e04a4a';g.fillRect(x-bw/2,y-23,Math.round(bw*pc),2)}})}
  return out};

/* ---------- network tick (10 Hz, independent of pause/panels) ---------- */
setInterval(()=>{if(!MP.role||!pl)return;
  if(MP.role==2){if(MP.hostConn)sendC(MP.hostConn,Object.assign({t:'pos'},myState()));return}

    const m=[];for(const o of vis){if(Math.hypot(o.x-r.tx,o.y-r.ty)<520)m.push([o.mid,o.s.i,Math.round(o.x),Math.round(o.y),Math.round(o.hp),o.mhp,o.f,o.lvl,Math.round(o.sc*100),o.boss?1:0,o.shiny?1:0,o.h>0?1:0,o.aggro?1:0])}
    sendC(p.conn,{t:'st',p:pa.filter(a=>a[0]!==id),m});if(env)sendC(p.conn,{t:'env',time,wx:WX})}},100);

<script>

`;

/* ---------- lobby panel ---------- */

    if(!RP.size)s+='<small>Waiting for friends...</small>'}

  h.innerHTML=s;$q('#mpl').style.display=on?'block':'none';$q('#mpi').style.display=on?'flex':'none';
  $q('#mpf').innerHTML='';

function chatLog(){const l=$q('#mpl');if(!l)return;l.innerHTML=C.LOG.slice(-40).map(x=>x.n?`<div><b>${esc(x.n)}:</b> ${esc(x.m)}</div>`:`<div class="sy">${esc(x.m)}</div>`).join('');l.scrollTop=l.scrollHeight}

function open(){ui.style.display='flex';render()}

  if(a=='close')close();else if(a=='host')C.startHost();else if(a=='join'){codeVal=$q('#mpcode').value;C.joinRoom(codeVal)}

  else if(a=='trade'){close();G.startTrade(b.dataset.id)}else if(a=='duel'){close();G.startDuel(b.dataset.id)}});

setInterval(()=>{const led=document.body.classList.contains('ledit'),mo=$q('#menu')&&getComputedStyle($q('#menu')).display=='flex',show=led||((typeof playing!='undefined'&&playing&&!panelOpen)&&!mo);btn.style.display=show?'block':'none'},400);
window.MPUI={open,close,render,chat};

/* ---------- trading + duels ---------- */
let TR=null,DU=null,ASK=null;
const G=window.MPG={rx,gone,reset,startTrade,startDuel};
function askBox(from,kind){ASK={from,kind};ask.innerHTML=`${esc(nameOf(from))} wants to ${kind=='tr'?'trade with you':'have a pet duel'}<br><button data-k="y">Accept</button><button class="r" data-k="n">Decline</button>`;ask.style.display='block';clearTimeout(askBox.t);askBox.t=setTimeout(()=>{if(ASK&&ASK.from==from){ASK=null;ask.style.display='none';C.sendTo(from,{t:kind=='tr'?'tra':'dua',ok:0})}},20000)}
ask.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||!ASK)return;const a=ASK;ASK=null;ask.style.display='none';clearTimeout(askBox.t);const ok=b.dataset.k=='y';
  C.sendTo(a.from,{t:a.kind=='tr'?'tra':'dua',ok:ok?1:0});if(ok){if(a.kind=='tr')trOpen(a.from);else duOpen(a.from,0)}});
function busy(){return TR||DU}
function rx(from,m){switch(m.t){

function gone(id){if(TR&&TR.id==id){say2(nameOf(id)+' left - trade cancelled');trClose()}if(DU&&DU.id==id){say2(nameOf(id)+' left - duel ended');duClose()}if(ASK&&ASK.from==id){ASK=null;ask.style.display='none'}}
function reset(){trClose();duClose();ASK=null;ask.style.display='none'}
const say2=s=>{try{tip(s)}catch(e){}};

/* --- trade --- */
const cleanItems=o=>{const r={};if(o&&typeof o=='object')for(const k of Object.keys(o).slice(0,200)){const n=Math.floor(+o[k]);if(n>0&&n<1e6&&/^[\w-]{1,24}$/.test(k))r[k]=n}return r};
const cleanPets=a=>(Array.isArray(a)?a:[]).slice(0,6).map(p=>({sp:+p.sp|0,lvl:Math.max(1,Math.min(99,+p.lvl|0||1)),xp:Math.max(0,+p.xp||0),shiny:p.shiny?1:0,t:Date.now()})).filter(p=>SP[p.sp]&&!SP[p.sp].void);
function startTrade(id){if(!MP.role||busy())return;TR={id,wait:1,me:{items:{},coin:0,refs:[],v:0,ready:0},them:{items:{},coin:0,pets:[],v:0,ready:0}};C.sendTo(id,{t:'trq'});say2('Trade request sent...');trShow()}
function trOpen(id){TR={id,wait:0,me:{items:{},coin:0,refs:[],v:0,ready:0},them:{items:{},coin:0,pets:[],v:0,ready:0}};trShow()}
function trClose(){TR=null;trUI.style.display='none'}
function myPets(){const a=[];PETS.forEach((p,i)=>{if(i!==AP)a.push(p)});STORE.forEach(p=>a.push(p));return a}
function trSend(){const T=TR;T.me.v++;T.me.ready=0;C.sendTo(T.id,{t:'tro',items:T.me.items,coin:T.me.coin,pets:T.me.refs.map(p=>({sp:p.sp,lvl:p.lvl,xp:p.xp||0,shiny:p.shiny?1:0})),v:T.me.v});trShow()}
function trShow(){const T=TR;if(!T)return;trUI.style.display='flex';const c=$q('#trc');
  if(T.wait){c.innerHTML=`<h3>Trade with ${esc(nameOf(T.id))}</h3><p>Waiting for them to accept...</p><button class="r" data-a="cancel">Cancel</button>`;return}
  const ks=Object.keys(inv).filter(k=>inv[k]>0).sort(),pets=myPets();
  let h=`<h3>Trade with ${esc(nameOf(T.id))}</h3><b>You offer</b><div class="trs">`;
  h+=`<div class="rw"><span class="gr">Coins (you have ${COIN})</span><input type="number" id="trcoin" min="0" max="${COIN}" value="${T.me.coin}" style="width:90px"></div>`;
  h+=ks.map(k=>{const n=T.me.items[k]||0;return`<div class="rw"><span class="gr">${esc(nm(k))} <small>x${inv[k]}</small></span><button data-a="dn" data-k="${esc(k)}">-</button><b>${n}</b><button data-a="up" data-k="${esc(k)}">+</button></div>`}).join('')||'<small>Your bag is empty</small>';
  h+=pets.map((p,i)=>`<div class="rw"><label class="gr"><input type="checkbox" data-a="pet" data-i="${i}" ${T.me.refs.includes(p)?'checked':''}> ${esc(pname(p))} Lv${p.lvl}</label></div>`).join('');
  h+=`</div><b>${esc(nameOf(T.id))} offers</b><div class="trs">`;
  const th=T.them,tl=Object.keys(th.items).map(k=>`${esc(nm(k))} x${th.items[k]}`).concat(th.pets.map(p=>`${esc(pname(p))} Lv${p.lvl}`));if(th.coin)tl.unshift(th.coin+' coins');
  h+=(tl.length?tl.map(x=>`<div>${x}</div>`).join(''):'<small>Nothing yet</small>')+'</div>';
  h+=`<div>${T.me.ready?'You: <b style="color:#6ae08a">READY</b>':'You: not ready'} · ${th.ready?'They: <b style="color:#6ae08a">READY</b>':'They: not ready'}</div>`;
  h+=`<button data-a="ready">${T.me.ready?'Unready':'Ready ✓'}</button><button class="r" data-a="cancel">Cancel</button><div><small>Any change resets both players' ready status. Trades happen when both are ready.</small></div>`;
  const keep=document.activeElement&&document.activeElement.id=='trcoin';c.innerHTML=h;if(keep){const e=$q('#trcoin');if(e){e.focus()}}}
trUI.addEventListener('change',e=>{if(!TR||TR.wait)return;if(e.target.id=='trcoin'){TR.me.coin=Math.max(0,Math.min(COIN,e.target.value|0));trSend()}else if(e.target.dataset&&e.target.dataset.a=='pet'){const p=myPets()[+e.target.dataset.i];if(!p)return;const r=TR.me.refs,i=r.indexOf(p);if(e.target.checked&&i<0)r.push(p);else if(!e.target.checked&&i>=0)r.splice(i,1);trSend()}});
trUI.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||!TR)return;const a=b.dataset.a,T=TR;
  if(a=='cancel'){C.sendTo(T.id,{t:'trx'});trClose();return}if(T.wait)return;
  if(a=='up'||a=='dn'){const k=b.dataset.k,n=(T.me.items[k]||0)+(a=='up'?1:-1);if(n<=0)delete T.me.items[k];else if(n<=(inv[k]||0))T.me.items[k]=n;trSend()}
  else if(a=='ready'){T.me.ready=T.me.ready?0:1;C.sendTo(T.id,{t:'trr',r:T.me.ready,mv:T.me.v,tv:T.them.v});trShow();trCheck()}});
function trCheck(){const T=TR;if(!T||!T.me.ready||!T.them.ready)return;
  const me=T.me;for(const k in me.items)if((inv[k]||0)<me.items[k]){say2('Trade failed: missing items');C.sendTo(T.id,{t:'trx'});trClose();return}
  if(COIN<me.coin){say2('Trade failed: not enough coins');C.sendTo(T.id,{t:'trx'});trClose();return}
  const pool=myPets();for(const p of me.refs)if(!pool.includes(p)){say2('Trade failed: pet unavailable');C.sendTo(T.id,{t:'trx'});trClose();return}
  for(const k in me.items)add(k,-me.items[k]);COIN-=me.coin;
  for(const p of me.refs){let i=PETS.indexOf(p);if(i>=0){PETS.splice(i,1);if(i<AP)AP--}else{i=STORE.indexOf(p);if(i>=0)STORE.splice(i,1)}}
  const th=T.them;for(const k in th.items)add(k,th.items[k]);COIN+=th.coin;
  for(const p of th.pets){if(PETS.length<6)PETS.push(p);else STORE.push(p);DEX[p.sp]=Math.max(DEX[p.sp]||0,2)}

/* --- pet duel --- */

  const mk=i=>({n:i.n,sp:i.sp,hp:i.mx,mx:i.mx,atk:i.atk,spd:i.spd,el:i.el,cd:0,lvl:i.lvl,mv:0});D.a=mk(D.imA?D.me:D.opp);D.b=mk(D.imA?D.opp:D.me);D.log.push('The duel begins!');duShow()}
function duClose(){DU=null;duUI.style.display='none'}
function duShow(){const D=DU;if(!D)return;duUI.style.display='flex';const c=$q('#duc');

  const me=D.imA?D.a:D.b,op=D.imA?D.b:D.a,bar=x=>`<div class="hpb"><i style="width:${Math.max(0,Math.round(100*x.hp/x.mx))}%"></div><small>${x.hp}/${x.mx}</small>`;

  else{const picked=D.mc[D.turn]!=null;h+=`<div>Turn ${D.turn}${picked?' - waiting for '+esc(nameOf(D.id))+'...':' - choose your move'}</div><button data-a="m0" ${picked?'disabled':''}>Attack</button><button class="g" data-a="m1" ${picked||me.cd>0?'disabled':''}>Special${me.cd>0?' ('+me.cd+')':''}</button><button data-a="m2" ${picked?'disabled':''}>Guard</button><button class="r" data-a="leave">Forfeit</button>`}
  c.innerHTML=h;const l=$q('#dul');if(l)l.scrollTop=l.scrollHeight}
duUI.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||!DU)return;const a=b.dataset.a,D=DU;
  if(a=='leave'){C.sendTo(D.id,{t:'dux'});duClose();return}
  if(a[0]=='m'&&D.a&&!D.done&&D.mc[D.turn]==null){const mv=+a[1];D.mc[D.turn]=mv;C.sendTo(D.id,{t:'duc',turn:D.turn,mv});duShow();duResolve()}});
const mul=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function duResolve(){const D=DU;if(!D||!D.a||D.done)return;const T=D.turn;if(D.mc[T]==null||D.oc[T]==null)return;
  const A=D.a,B=D.b;A.mv=D.imA?D.mc[T]:D.oc[T];B.mv=D.imA?D.oc[T]:D.mc[T];const r=mul(D.seed+T*7919),L=D.log;
  A.g=A.mv==2;B.g=B.mv==2;if(A.g)A.hp=Math.min(A.mx,A.hp+Math.round(A.mx*.08));if(B.g)B.hp=Math.min(B.mx,B.hp+Math.round(B.mx*.08));
  const ord=(A.spd>B.spd||(A.spd==B.spd&&r()<.5))?[A,B]:[B,A];
  for(const x of ord){const y=x===A?B:A;if(x.hp<=0||y.hp<=0)continue;if(x.mv==2){L.push(x.n+' braces for impact');continue}
    let d=x.atk*(.88+r()*.24),tag='';if(x.mv==1&&x.cd<=0){const e=eff(x.el,y.el);d*=1.7*e;x.cd=3;tag=e>1?' - super effective!':e<1?' - not very effective':' - special!'}
    if(r()<.1){d*=1.6;tag+=' CRIT!'}if(y.g)d*=.4;d=Math.max(1,Math.round(d));y.hp=Math.max(0,y.hp-d);L.push(`${x.n} hits ${y.n} for ${d}${tag}`)}
  A.cd=Math.max(0,A.cd-1);B.cd=Math.max(0,B.cd-1);
  if(A.hp<=0||B.hp<=0){const meA=D.imA,aw=B.hp<=0&&A.hp>0,bw=A.hp<=0&&B.hp>0;D.done=aw||bw?((aw&&meA)||(bw&&!meA)?1:2):3;
    if(D.done==1){const lv=(D.imA?B:A).lvl;COIN+=20+lv*3;const p=PETS[AP];if(p)p.xp+=8;L.push('You earned '+(20+lv*3)+' coins!');try{sfx('quest')}catch(e){}}}
  else D.turn++;duShow()}
setInterval(()=>{if(DU&&DU.done===0&&!DU.wait&&DU.a&&DU.log.length>40)DU.log.splice(0,10)},5000);
})();
